[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/route"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/vworld"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/live"
  to = "/.netlify/functions/api"
  status = 200
  force = true
