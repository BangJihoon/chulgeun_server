[build]
  functions = "netlify/functions"

[build.environment]
  # These are non-secret runtime settings whose documented defaults are
  # intentionally present in the server source and example configuration.
  SECRETS_SCAN_OMIT_KEYS = "PORT,VWORLD_CONFIG_PATH,UPSTREAM_TIMEOUT_MS"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/route"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/vworld"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/live"
  to = "/.netlify/functions/api"
  status = 200
  force = true
